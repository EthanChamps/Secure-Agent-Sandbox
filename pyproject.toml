[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "secure-agent-sandbox"
version = "0.1.0"
description = "Typed agent handoffs and deterministic, monotonic tool authorization"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["pydantic>=2.11,<3", "z3-solver>=4.13,<5"]

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/secure_agent_sandbox"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
