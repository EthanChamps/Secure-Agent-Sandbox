# Network baseline only: requires a CNI that enforces NetworkPolicy.
# No egress exception is installed; broker integration is an explicit deployment step.
apiVersion: v1
kind: Namespace
metadata:
  name: secure-agent-sandboxes
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: secure-agent-sandboxes
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress: []
---
# Install/configure the runsc containerd handler before using this RuntimeClass.
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: gvisor
handler: runsc
